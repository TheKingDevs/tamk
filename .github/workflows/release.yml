name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: android
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -trimpath \
            -ldflags="-s -w -X 'github.com/TheKingDevs/tamk/internal/config.Version=${VERSION}' -X 'github.com/TheKingDevs/tamk/internal/config.Commit=${GITHUB_SHA::8}' -X 'github.com/TheKingDevs/tamk/internal/config.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o tamk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/tamk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tamk-*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          path: artifacts/

      - name: Collect artifacts
        run: |
          mkdir -p dist/
          find artifacts/ -type f -name 'tamk-*' -exec cp {} dist/ \;

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changes }}

            ## Downloads

            | Platform | File |
            |:---------|:-----|
            | Linux x64 | `tamk-linux-amd64` |
            | Linux ARM64 | `tamk-linux-arm64` |
            | Android ARM64 (Termux) | `tamk-android-arm64` |
            | macOS ARM64 | `tamk-darwin-arm64` |
            | Windows x64 | `tamk-windows-amd64.exe` |

            ### Termux Install
            ```bash
            pkg install wget
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tamk-android-arm64
            chmod +x tamk-android-arm64
            mv tamk-android-arm64 $PREFIX/bin/tamk
            ```
          files: |
            dist/tamk-*
