name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64,android/arm64,darwin/arm64,windows/amd64'

permissions:
  contents: read

jobs:
  build-matrix:
    name: Generate Build Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          PLATFORMS="${{ inputs.platforms || 'linux/amd64,linux/arm64,android/arm64,darwin/arm64,windows/amd64' }}"
          MATRIX=$(echo "$PLATFORMS" | tr ',' '\n' | jq -R -s -c '
            split("\n")[:-1] | map(
              split("/") | {
                goos: .[0],
                goarch: .[1],
                suffix: (if .[0] == "windows" then ".exe" else "" end)
              }
            ) | {include: .}
          ')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(grep 'Version = ' internal/config/config.go | head -1 | sed 's/.*"\(.*\)".*/\1/')
          go build -trimpath \
            -ldflags="-s -w -X 'github.com/TheKingDevs/tamk/internal/config.Version=${VERSION}' -X 'github.com/TheKingDevs/tamk/internal/config.Commit=${GITHUB_SHA::8}'" \
            -o tamk-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} \
            ./cmd/tamk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tamk-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tamk-*
          retention-days: 7

  verify:
    name: Verify Build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "=== Built artifacts ==="
          find artifacts/ -type f -exec ls -lh {} \;
