name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Tidy
      run: go mod tidy

    - name: Build
      run: go build -o bin/tamk ./cmd/tamk

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -count=1 -short ./...
      env:
        TAMK_HOME: ${{ github.workspace }}
