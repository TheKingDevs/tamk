version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    assignees:
      - TheKingDevs
    versioning-strategy: increase-if-necessary
    groups:
      go-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      go-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    assignees:
      - TheKingDevs
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
